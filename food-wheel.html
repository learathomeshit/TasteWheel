</main><script>
const KEY='food-wheel-items-v2',HISTORY='food-wheel-history-v1',COLORS=['#7fa982','#9bbf9d','#e5c879','#e89a7e','#86b8ae','#88aeb8','#a29abf','#c88778','#9aab7d','#d4aa76'];

let items=load(),rotation=0,spinning=false,filtered=[],hoveredIndex=-1,expandedCategories=new Set();const $=id=>document.getElementById(id)||{onclick:null},canvas=$('wheel'),ctx=canvas.getContext('2d');

function draw(){let size=Math.floor($('wheel').parentElement.clientWidth),dpr=Math.min(devicePixelRatio||1,2);canvas.width=size*dpr;canvas.height=size*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,size,size);let arr=filtered,N=arr.length,r=size/2-8;let mode=N<=12?'full':N<=24?'compact':'numbered';if(!N){ctx.fillStyle='#bbb';ctx.beginPath();ctx.arc(size/2,size/2,r,0,7);ctx.fill();return}let slice=Math.PI*2/N;arr.forEach((x,i)=>{let a=rotation+i*slice;ctx.beginPath();ctx.moveTo(size/2,size/2);ctx.arc(size/2,size/2,r,a,a+slice);ctx.fillStyle=COLORS[i%COLORS.length];ctx.fill();if(i===hoveredIndex){ctx.fillStyle='rgba(255,255,255,.28)';ctx.fill()}ctx.strokeStyle='rgba(255,255,255,.45)';ctx.stroke();let mid=a+slice/2,l=r*(mode==='numbered'?.68:.62);ctx.fillStyle='#fff';ctx.font=`700 ${mode==='numbered'?12:mode==='compact'?13:15}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';let label=mode==='numbered'?String(i+1).padStart(2,'0'):x.name.length>(mode==='compact'?4:6)?x.name.slice(0,mode==='compact'?4:6)+'…':x.name;ctx.fillText(label,size/2+Math.cos(mid)*l,size/2+Math.sin(mid)*l)});ctx.beginPath();ctx.arc(size/2,size/2,r*.18,0,7);ctx.fillStyle='#fff';ctx.fill();ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--ink');ctx.font='700 12px system-ui';ctx.textAlign='center';ctx.fillText(`${$('category').value||'全部'} · ${N}道`,size/2,size/2)}
function renderList(){let el=$('dishList');el.innerHTML='';items.forEach(x=>{let li=document.createElement('li');li.innerHTML=`<span>${x.name} · ${x.category}</span><button class="del" aria-label="删除 ${x.name}">×</button>`;li.querySelector('.del').onclick=()=>{if(items.length>1){items=items.filter(y=>y.id!==x.id);save();refresh()}};li.querySelector('span').onclick=()=>{let n=prompt('修改菜名',x.name);if(n&&n.trim()){x.name=n.trim();save();refresh()}};el.append(li)})}function renderPreview(){let el=$('dishPreview'),groups={};items.forEach(x=>{let c=x.category||'未分类';(groups[c]??=[]).push(x)});let current=$('category').value||'全部';$('previewCount').textContent=`（${filtered.length}道）`;el.innerHTML=Object.entries(groups).map(([category,dishes])=>{let open=expandedCategories.has(category)||(current!=='全部'&&category===current);return `<section class="dish-group"><button class="dish-group-head" data-group="${category}"><span>${category}</span><span class="group-meta">${dishes.length} 道 ${open?'⌃':'⌄'}</span></button><div class="dish-group-body" ${open?'':'hidden'}>${dishes.map(x=>{let i=filtered.indexOf(x);return `<div class="dish-preview-item" title="${x.name}"><b>${i>=0?String(i+1).padStart(2,'0'):'—'}</b>${x.name}</div>`}).join('')}</div></section>`}).join('');el.querySelectorAll('.dish-group-head').forEach(btn=>btn.onclick=()=>{let c=btn.dataset.group;if(expandedCategories.has(c))expandedCategories.delete(c);else expandedCategories.add(c);renderPreview()})}function refresh(){fillSelects();renderList();visible();let current=$('category').value||'全部';if(current!=='全部')expandedCategories.add(current);renderPreview()}function spin(){if(spinning||filtered.length<2){if(filtered.length<2)$('result').innerHTML='<span class="empty">当前分类至少需要两道菜</span>';return}spinning=true;$('spin').disabled=true;let pool=filtered,history=JSON.parse(localStorage.getItem(HISTORY)||'[]'),avoid=$('avoidRecent').checked,choices=avoid?pool.filter(x=>!history.includes(x.id)):pool;if(choices.length<2)choic function findRecipes(){let input=split($('ingredientInput').value).map(x=>x.toLowerCase()),chips=$('ingredientChips');chips.innerHTML=input.map(x=>`<span class="chip">${x}</span>`).join('');let out=items.map(x=>{let have=(x.ingredients||[]).filter(i=>input.some(v=>i.toLowerCase().includes(v)||v.includes(i.toLowerCase()))),missing=(x.ingredients||[]).filter(i=>!have.includes(i));return{...x,have,missing,score:have.length/(x.ingredients||[]).length}}).filter(x=>x.have.length).sort((a,b)=>b.score-a.score);$('recipes').innerHTML=out.length?out.slice(0,8).map(x=>`<article class="recipe"><h3>${x.name}</h3><small>${x.category} · 已有：${x.have.join('、')||'无'}${x.missing.length?' · 还需要：'+x.missing.join('、'):''}</small></article>`).join(''):'<div class="empty">暂时没有匹配菜谱，请增加食材或扩充本地菜品。</div>'}
function importText(text){let added=[],errors=[];text.split(/\r?\n/).forEach((line,index)=>{let value=line.trim();if(!value)return;let parts=value.split('·');if(parts.length!==2||!parts[0].trim()||!parts[1].trim()){errors.push(index+1);return}let name=parts[0].trim(),category=parts[1].trim();if(!items.some(x=>x.name===name&&x.category===category)){let dish=make([name,category,[]]);items.push(dish);added.push(dish)}});if(added.length){save();refresh()}let message=`成功导入 ${added.length} 道菜品。`;if(errors.length)message+=`\n以下行格式有误，已跳过：${errors.join('、')}`;alert(message)}
function exportMenu(){let text=items.map(x=>`${x.name}·${x.category||'未分类'}`).join('\r\n');let blob=new Blob([text+'\r\n'],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='我的菜谱.txt';a.click();URL.revokeObjectURL(url)}
canvas.addEventListener('mousemove',e=>{if(filtered.length<2)return;let rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left-rect.width/2,y=e.clientY-rect.top-rect.height/2,angle=Math.atan2(y,x)-rotation;let index=Math.floor((((angle%(Math.PI*2))+Math.PI*2)%(Math.PI*2))/(Math.PI*2/filtered.length));if(index!==hoveredIndex){hoveredIndex=index;draw()}let tip=$('wheelTooltip');tip.textContent=filtered[index].name;tip.style.left=`${e.clientX+12}px`;tip.style.top=`${e.clientY+12}px`;tip.style.display='block'});canvas.addEventListener('mouseleave',()=>{hoveredIndex=-1;draw();$('wheelTooltip').style.display='none'});
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.mode+'-panel').classList.add('active');if(b.dataset.mode==='wheel')draw()});$('category').onchange=visible;$('spin').onclick=spin;$('find').onclick=findRecipes;$('add').onclick=()=>{let n=$('dishName').value.trim();if(!n)return;items.push(make([n,$('dishCategory').value,[]]));$('dishName').value='';save();refresh()};$('dishName').onkeydown=e=>{if(e.key==='Enter')$('add').click()};$('reset').onclick=()=>{if(confirm('恢复默认菜品？')){items=defaults.map(make);save();refresh()}};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=e=>{let file=e.target.files[0];if(!file)return;if(file.type&&file.type!=='text/plain'&&!file.name.toLowerCase().endsWith('.txt')){alert('只能导入 .txt 文本文件');e.target.value='';return}let reader=new FileReader();reader.onload=()=>importText(String(reader.result||''));reader.onerror=()=>alert('文件读取失败，请重试');reader.readAsText(file,'UTF-8');e.target.value=''};$('formatBtn').onclick=()=>alert('文本文件导入格式：\n\n红烧肉·荤菜\n番茄炒蛋·素菜\n紫菜蛋花汤·汤菜\n\n每行一道菜，菜品和分类之间使用“·”，空行会自动忽略。');refresh();addEventListener('resize',draw);
document.getElementById('category').addEventListener('change',()=>{let current=document.getElementById('category').value;if(current!=='全部')expandedCategories.add(current);renderPreview()});
document.getElementById('dishPreview').addEventListener('click',e=>{let btn=e.target.closest('.dish-group-head');if(!btn)return;e.preventDefault();e.stopImmediatePropagation();btn.onclick=null;let c=btn.dataset.group,group=btn.closest('.dish-group'),body=group.querySelector('.dish-group-body'),meta=group.querySelector('.group-meta'),open=!expandedCategories.has(c);if(open)expandedCategories.add(c);else expandedCategories.delete(c);body.classList.toggle('hidden',!open);meta.textContent=`${body.children.length} 道 ${open?'⌃':'⌄'}`},true);document.getElementById('exportBtn').onclick=exportMenu;
new MutationObserver(()=>document.querySelectorAll('#dishPreview .dish-group-head').forEach(btn=>{btn.onclick=null})).observe(document.getElementById('dishPreview'),{childList:true,subtree:true});
const searchBox=document.createElement('div');searchBox.className='dish-search';searchBox.innerHTML='<input id="dishSearch" placeholder="搜索菜名（支持模糊搜索）" aria-label="搜索菜名"><span id="searchCount" class="search-count"></span>';document.querySelector('.dish-manager .add-row').after(searchBox);let dishSearch='';const originalRenderList=renderList;renderList=function(){let el=$('dishList'),matches=items.filter(x=>x.name.toLocaleLowerCase().includes(dishSearch.toLocaleLowerCase()));$('searchCount').textContent=dishSearch?`${matches.length} 道`:`${items.length} 道`;el.innerHTML='';matches.forEach(x=>{let li=document.createElement('li');li.innerHTML=`<input class="edit-name" value="${x.name.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}" aria-label="编辑菜名"><button class="del" aria-label="删除 ${x.name}">×</button>`;let input=li.querySelector('.edit-name');let commit=()=>{let n=input.value.trim();if(n&&n!==x.name){x.name=n;save();refresh()}};input.onchange=commit;input.onkeydown=e=>{if(e.key==='Enter'){commit();input.blur()}};li.querySelector('.del').onclick=()=>{if(items.length>1){items=items.filter(y=>y.id!==x.id);save();refresh()}};el.append(li)})};$('dishSearch').oninput=e=>{dishSearch=e.target.value.trim();renderList()};
window.addEventListener('click',e=>{let btn=e.target.closest?.('#dishPreview .dish-group-head');if(!btn)return;e.preventDefault();e.stopImmediatePropagation();let group=btn.closest('.dish-group'),body=group.querySelector('.dish-group-body'),meta=group.querySelector('.group-meta'),category=btn.dataset.group,open=body.classList.contains('hidden');body.classList.toggle('hidden',!open);if(open)expandedCategories.add(category);else expandedCategories.delete(category);meta.textContent=`${body.children.length} 道 ${open?'⌃':'⌄'}`},true);
